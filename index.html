<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在開啟預約系統...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffffff; }
        .container { text-align: center; padding: 0 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00b900; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; font-size: 16px; font-weight: bold; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .line-btn { display: none; padding: 14px 24px; font-size: 18px; font-weight: bold; color: #ffffff; background-color: #00b900; text-decoration: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .call-btn { padding: 12px 20px; font-size: 16px; font-weight: bold; color: #333; background-color: #f0f0f0; text-decoration: none; border-radius: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader"></div>
        <p id="status-text">正在為您開啟 LINE，請稍候...</p>

        <div class="btn-group">
            <a id="manual-line-btn" href="#" class="line-btn">👉 點此開啟 LINE 加入好友</a>
            <a href="tel:+886918052152" class="call-btn">☎️ 若無法加入，請點此打給專人</a>
        </div>
    </div>

    <script>
        const CONFIG = {
            LIFF_ID: "2010051953-xV0LzpeE",
            N8N_URL: "https://n8n.parzival0626.com/webhook/7393b3cc-4e62-4817-adaa-24e44c15a30d",
            MOBILE_OA_ID: "@813ckdcf",
            PC_OA_ID: "@813ckdcf",
            FALLBACK_URL: "https://lin.ee/7fXzt2u"
        };

        const MAX_HOPS = 3;

        function send(data) {
            try {
                const formData = new URLSearchParams();
                for (const key in data) { formData.append(key, data[key]); }
                if (window.fetch) {
                    fetch(CONFIG.N8N_URL, { method: 'POST', body: formData, mode: 'no-cors', keepalive: true })
                        .catch(() => { if (navigator.sendBeacon) navigator.sendBeacon(CONFIG.N8N_URL, formData); });
                } else if (navigator.sendBeacon) {
                    navigator.sendBeacon(CONFIG.N8N_URL, formData);
                }
            } catch (err) { console.error("Webhook 送出失敗", err); }
        }

        function stopAndShowButton(targetUrl, statusMsg) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status-text').innerText = statusMsg || "請點擊下方綠色按鈕加入 LINE：";
            const btn = document.getElementById('manual-line-btn');
            btn.href = targetUrl || CONFIG.FALLBACK_URL;
            btn.style.display = 'inline-block';
        }

        function getParam(params, key, storageKey) {
            const v = params.get(key) || sessionStorage.getItem(storageKey) || "";
            if (v) sessionStorage.setItem(storageKey, v);
            return v;
        }

        function safeRedirect(url, statusMsg) {
            let hops = parseInt(sessionStorage.getItem('hop_count') || "0", 10) + 1;
            sessionStorage.setItem('hop_count', String(hops));
            stopAndShowButton(url, statusMsg);
            if (hops > MAX_HOPS) return;
            window.location.assign(url);
        }

        async function main() {
            try {
                const params = new URLSearchParams(window.location.search);
                const ua = navigator.userAgent.toLowerCase();
                const isLineUA = ua.indexOf('line') > -1;
                const isMobile = /iphone|ipad|ipod|android/.test(ua);
                const host = window.location.hostname.toLowerCase();
                const onLiffHost = host.indexOf('liff.line.me') > -1 || host.indexOf('line.me') > -1;

                const enteredLiff =
                    params.get('in_liff') === '1' ||
                    sessionStorage.getItem('entered_liff') === '1';

                const gclid = getParam(params, 'gclid', 'saved_gclid');

                fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(d => { if (d.ip) sessionStorage.setItem('saved_ip', d.ip); })
                    .catch(() => {});

                const addFriendUrl = `https://line.me/R/ti/p/${CONFIG.MOBILE_OA_ID}`;

                if (isLineUA || enteredLiff || onLiffHost) {
                    sessionStorage.setItem('entered_liff', '1');

                    let payload = {
                        gclid,
                        user_ip:    sessionStorage.getItem('saved_ip') || "unknown",
                        source:     "Inside_Line",
                        timestamp:  new Date().toISOString(),
                        lineUserId: "",
                        lineName:   ""
                    };

                    let liffReady = false;
                    let loggedIn = false;
                    try {
                        await Promise.race([
                            (async () => {
                                await liff.init({ liffId: CONFIG.LIFF_ID });
                                liffReady = true;
                                loggedIn = liff.isLoggedIn();
                            })(),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('liff_timeout')), 6000))
                        ]);
                    } catch (e) {}

                    if (liffReady && loggedIn) {
                        try {
                            const profile = await liff.getProfile();
                            payload.lineUserId = profile.userId;
                            payload.lineName   = profile.displayName;
                            payload.source     = "Mobile_Success_UID";
                            payload.user_ip    = sessionStorage.getItem('saved_ip') || "unknown";
                        } catch (e) {
                            payload.source = "Mobile_LIFF_Profile_Error";
                        }
                        send(payload);
                        safeRedirect(addFriendUrl, "即將帶您加入好友，若未自動開啟請點下方按鈕：");
                        return;
                    }

                    payload.source = liffReady ? "Chrome_Incognito_NoName_Manual" : "Mobile_LIFF_Timeout_Manual";
                    send(payload);
                    stopAndShowButton(addFriendUrl, "請點擊下方綠色按鈕加入 LINE 👇");
                    return;
                }

                sessionStorage.setItem('entered_liff', '1');

                const qs = `in_liff=1&gclid=${encodeURIComponent(gclid)}`;

                const targetUrl = isMobile
                    ? `https://liff.line.me/${CONFIG.LIFF_ID}?${qs}`
                    : `https://line.me/R/ti/p/${CONFIG.PC_OA_ID}?gclid=${encodeURIComponent(gclid)}`;

                safeRedirect(targetUrl, "若未自動開啟，請點擊下方按鈕加入 LINE：");

            } catch (fatalError) {
                console.error("發生嚴重錯誤", fatalError);
                stopAndShowButton(CONFIG.FALLBACK_URL, "開啟發生問題，請點下方按鈕：");
            }
        }

        main();
    </script>
</body>
</html>
